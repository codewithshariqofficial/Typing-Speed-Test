<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Typing Speed Test</h1>
            <p>Test your typing speed and accuracy!</p>
        </header>

        <section class="stats-container">
            <div class="stat-box">
                <span class="label">Time</span>
                <span id="timer" class="value">60s</span>
            </div>
            <div class="stat-box">
                <span class="label">WPM</span>
                <span id="wpm" class="value">0</span>
            </div>
            <div class="stat-box">
                <span class="label">Accuracy</span>
                <span id="accuracy" class="value">0%</span>
            </div>
            <div class="stat-box">
                <span class="label">Errors</span>
                <span id="errors" class="value">0</span>
            </div>
        </section>

        <main class="typing-container">
            <div id="quote-display" class="quote-display">
                <!-- Text will be loaded here via JavaScript -->
                Loading text...
            </div>
            <textarea id="quote-input" class="quote-input" autofocus placeholder="Start typing here..."></textarea>
        </main>

        <footer class="controls">
            <button id="reset-btn" class="btn">Restart Test</button>
        </footer >
    </div>
    <script src="script.js"></script>
</body>
</html>
